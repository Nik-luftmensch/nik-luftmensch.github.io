<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nikhil Singh - Terminal Portfolio</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="img/favicon.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/main.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" crossorigin="anonymous" />

  <style>
    #matrix-canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5000;
      display: none;
    }

    #video-background {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1000;
      background: black;
    }

    video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -100;
      background: black;
    }

    #content {
      position: relative;
      z-index: 1;
    }
  </style>
</head>

<body>
  <!-- Background Video -->
  <video id="video-background" autoplay loop muted playsinline>
    <source src="img/back_video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- Audio Control -->
  <audio id="audio" src="img/back_audio.mp3" loop></audio>
  <button id="audio-player-button" class="audio-control">
    <i class="fas fa-volume-mute"></i>
  </button>

  <!-- Matrix Canvas -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Terminal UI -->
  <div id="content">
    <div id="sidenav">
      <button id="sidenavBtn"><span class="hamburger-icon">&#9776;</span></button>
      <img class="image-rounded" id="profilePic" alt="Nikhil Singh" src="./img/nik.jpg" />
    </div>

    <div id="container">
      <div id="terminal-prompt"></div>
      <div id="output"></div>
      <div id="input-line" class="input-line">
        <div id="prompt" class="prompt-color"></div>&nbsp;
        <div id="command">
          <input
            type="text"
            id="cmdline"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            autofocus
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Socket.IO for WebSocket -->
  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

  <!-- Polyfill for older browsers -->
  <script src="./js/polyfills.js"></script>

  <!-- EmailJS SDK for sending emails -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    window.addEventListener("load", function () {
      if (typeof emailjs !== "undefined") {
        emailjs.init("vcJ-C6ZjQUne37qPP");
      }
    });
  </script>

  <!-- Main Terminal Logic (ES Module) -->
  <script type="module" src="./js/main.js"></script>

  <!-- Audio/Video & Other DOM logic -->
  <script src="./js/script.js"></script>
</body>
</html>
